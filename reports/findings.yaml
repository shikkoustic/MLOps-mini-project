# MP128 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G107"          # your group id, e.g. "G042"
problem_id: "MP128"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  # Found by: src/mp128/data_checks.py (Stage 1 work)
  leaking_column:
    present: false
    column: null           # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: "wind_kmph"    # the column recorded in a different unit
    group_value: "Residential"  # the value of station_zone whose rows are affected
    factor: 1000           # wrong value = right value x factor
  sentinel_value:
    present: true
    column: "stubble_fires"
    value: 9999            # the special number typed instead of a blank
    count: 54              # how many rows have it
  duplicate_rows:
    present: false
    count: null            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: false
    column: null
    start_date: null       # first date with the stuck value, YYYY-MM-DD
    end_date: null         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: true
    count: 9               # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: "day_type"
    true_levels: 3         # how many real categories there are after cleaning

tracking:
  experiment_name: null
  best_run_id: null        # the MLflow run id of your v1 model
  registered_model_name: null
  champion_version: null

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    pm25_today: null
    wind_kmph: null
    humidity_pct: null
    temp_c: null
    traffic_index: null
    stubble_fires: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of station_zone
    'Central': null
    'Residential': null
    'Industrial': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
