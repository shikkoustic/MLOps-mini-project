apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp128-api
  labels:
    app: mp128-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp128-api
  template:
    metadata:
      labels:
        app: mp128-api
    spec:
      containers:
        - name: mp128-api
          image: mp128-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
